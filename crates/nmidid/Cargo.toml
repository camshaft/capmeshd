[package]
name = "nmidid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MIDI data-plane daemon — serves the capmesh-ctl control socket"
readme = "README.md"

[[bin]]
name = "nmidid"
path = "src/main.rs"

[[bin]]
name = "nmidi-fake-source"
path = "src/bin/fake_source.rs"

[lib]
name = "nmidid"
path = "src/lib.rs"

[dependencies]
nmidi-core = { path = "../nmidi-core" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
midir.workspace = true
libc = "0.2"

[dev-dependencies]
# Guard that the PortDescriptor nmidid emits stays wire-compatible with the
# canonical capmesh-model definition capmeshd's client (and the mesh fetch)
# deserialize. Test-only: does not couple the production types.
capmesh-model = { path = "../capmesh-model" }
