<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Mount-prefix aware: the server injects the configured base ("/" at root, or
     e.g. "/surfaced/" behind nginx) so every relative URL below resolves under it. -->
<base href="__BASE_HREF__">
<title>surface</title>
<link rel="stylesheet" href="surface.css">
</head>
<body>
<header>
  <button id="menu" type="button" aria-label="Toggle inbox" aria-expanded="false">☰</button>
  <b>surface</b><span class="id" id="sid"></span>
  <span class="status" id="status">connecting…</span>
</header>
<main>
  <!-- The selected item, centered — the primary content on a phone. -->
  <div id="main"><div class="empty">No item selected yet.</div></div>
  <!-- The inbox feed is an off-canvas drawer (the hamburger toggles it on
       narrow screens; a wide screen shows it as a persistent sidebar). -->
  <div id="backdrop" hidden></div>
  <aside id="feed" aria-hidden="true">
    <h2>inbox <button id="clear" type="button" title="Clear all items">clear</button></h2>
    <ul id="list"></ul>
  </aside>
</main>
<script src="surface.js"></script>
</body>
</html>
