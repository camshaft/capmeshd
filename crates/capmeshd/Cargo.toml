[package]
name = "capmeshd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LAN capability mesh: stateless control-plane daemon (MIDI-first)"

[[bin]]
name = "capmeshd"
path = "src/main.rs"

[dependencies]
capmesh-discovery = { path = "../capmesh-discovery" }
capmesh-ctl = { path = "../capmesh-ctl" }
capmesh-daemon = { path = "../capmesh-daemon" }
capmesh-mesh = { path = "../capmesh-mesh" }
capmesh-model = { path = "../capmesh-model" }
tokio.workspace = true
axum = "0.8"
mdns-sd.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hostname.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
