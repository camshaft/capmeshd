[package]
name = "mcp-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "capmesh MCP gateway: federates mesh-discovered MCP servers behind one endpoint (DESIGN §7.2)"

[[bin]]
name = "mcp-gateway"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
# The pure cores (federation/client/server/serve) depend only on serde_json; the inbound `/mcp`
# HTTP transport (http.rs) adds axum + a tokio runtime, and the outbound HTTP forwarder (forward.rs)
# adds a hyper client. All already in the workspace lock.
axum = "0.8"
tokio.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes.workspace = true
# The GET /mcp SSE stream turns the (de)federation broadcast into tools/list_changed events.
tokio-stream = { version = "0.1", features = ["sync"] }
# The gateway daemon reads its route table + bind addr from a --config TOML (seq-1377: no env vars).
serde = { workspace = true }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# In-process transport tests (tower `oneshot`, no sockets), mirroring the capmeshd register endpoint.
tower = { version = "0.5", features = ["util"] }
